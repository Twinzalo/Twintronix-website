<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Snowflake & Swirl Mark (Left) -->
  <g transform="translate(60, 60)">
    <!-- Swirl swooshes -->
    <path d="M -44,-10 A 45,45 0 1,1 15,44" fill="none" stroke="url(#swirlGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -48,0 C -35,-32 5,-48 35,-32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 18,-24 C 36,-16 48,0 48,18" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Central Hexagon -->
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>
    <polygon points="0,-9 8,-4.5 8,4.5 0,9 -8,4.5 -8,-4.5" fill="#e0f2fe" opacity="0.8"/>

    <!-- 6 Snowflake arms -->
    <!-- Arm 1 (Up) -->
    <g>
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arm 2 (Down) -->
    <g transform="rotate(180)">
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arm 3 (60 deg) -->
    <g transform="rotate(60)">
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arm 4 (120 deg) -->
    <g transform="rotate(120)">
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arm 5 (240 deg) -->
    <g transform="rotate(240)">
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arm 6 (300 deg) -->
    <g transform="rotate(300)">
      <line x1="0" y1="-14" x2="0" y2="-38" stroke="url(#snowGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -9,-26 L 0,-31 L 9,-26" fill="none" stroke="url(#snowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -6,-35 L 0,-39 L 6,-35" fill="none" stroke="url(#snowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(130, 0)">
    <!-- Brand Title: TWINTRONIX -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="4">TWINTRONIX</text>
    
    <!-- Subtitle: REFRIGERATION with lines -->
    <line x1="2" y1="72" x2="40" y2="72" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="77" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#0284c7" letter-spacing="6">REFRIGERATION</text>
    <line x1="242" y1="72" x2="280" y2="72" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tagline: COOLING SOLUTIONS. TRUSTED PERFORMANCE. -->
    <line x1="2" y1="96" x2="22" y2="96" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <text x="30" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#475569" letter-spacing="1.5">COOLING SOLUTIONS. TRUSTED PERFORMANCE.</text>
    <line x1="334" y1="96" x2="354" y2="96" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
